name: 功能建议
description: 想要一个新能力，或改进现有行为
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        先看一下 [PRD §1.2](https://github.com/jiangbo202/asset-manager/blob/main/docs/PRD.md) 的非目标与 [路线图](https://github.com/jiangbo202/asset-manager/blob/main/README.md#-路线图)，
        避免和既有规划重复。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景
      description: 描述真实使用场景，而不是直接给方案
      placeholder: |
        我同时有美股和港股，每次季末想知道「这个季度净投入多少」，
        但现在只能看到当前时点的成本合计。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么解决
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 有考虑过其它做法吗
      description: 例如用导出的 JSON 自己算、用别的工具

  - type: dropdown
    id: scope
    attributes:
      label: 你判断这属于
      options:
        - 小改动（改文案/交互，不动数据结构）
        - 中等（新增页面或接口，可能加迁移）
        - 大改动（新数据模型或新子系统）
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: 约束确认
      description: 这个项目的硬约束，请确认你的建议不违反
      options:
        - label: 能在 Cloudflare 免费额度内运行（不需要 Workers Paid）
        - label: 不引入重型前端依赖（或可作为动态 import 加载）
        - label: 不涉及多用户/协作
